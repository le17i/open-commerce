services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencommerce
      POSTGRES_PASSWORD: opencommerce
      POSTGRES_MULTIPLE_DATABASES: opencommerce_catalog,opencommerce_accounts,opencommerce_payments
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.local/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opencommerce']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
